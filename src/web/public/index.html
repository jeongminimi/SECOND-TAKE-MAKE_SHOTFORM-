<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SECOND TAKE — 영상 편집기</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <h1>SECOND TAKE</h1>
  <p class="topNote">올라갈 모습 그대로 보면서 자르고, 글자는 눌러서 바로 고칩니다.</p>
</header>

<div class="notice" id="notice" hidden></div>

<div class="editLayout">
  <main class="editMain">
    <div id="picker" class="pickRow"></div>

    <!-- 1080×1920 그대로 만들고 한 번에 축소합니다 — 좌표가 결과물과 같은 숫자입니다. -->
    <div class="frameWrap" id="frameWrap">
      <div class="frameOuter" id="frameOuter">
        <div class="frame1080" id="frame"></div>
      </div>
      <p class="frameHint" id="frameHint">영상을 고르면 여기에 올라갈 모습이 그대로 나옵니다.</p>
    </div>

    <div class="transport" id="transport" hidden>
      <div class="tRow">
        <button class="btn" id="playPause" type="button">▶ 재생</button>
        <input type="range" id="seek" min="0" max="100" step="0.1" value="0">
        <span class="tTime"><b id="at">0:00</b> / <span id="len">0:00</span></span>
      </div>
      <div class="tRow">
        <button class="btn" id="markIn" type="button">여기부터</button>
        <input type="text" id="startAt" placeholder="0:00" inputmode="numeric">
        <button class="btn ghost tiny" data-nudge="start:-0.5" type="button">−0.5</button>
        <button class="btn ghost tiny" data-nudge="start:0.5" type="button">+0.5</button>
        <button class="btn" id="markOut" type="button">여기까지</button>
        <input type="text" id="endAt" placeholder="0:25" inputmode="numeric">
        <button class="btn ghost tiny" data-nudge="end:-0.5" type="button">−0.5</button>
        <button class="btn ghost tiny" data-nudge="end:0.5" type="button">+0.5</button>
        <button class="btn ghost" id="playSeg" type="button">구간만 재생</button>
      </div>
      <p class="segLen" id="segLen"></p>
    </div>

    <section class="card" id="result" hidden></section>
  </main>

  <aside class="editSide" id="panel"></aside>
</div>

<script src="/terms.js"></script>
<script src="/common.js"></script>
<script src="/compose.js"></script>
<script src="/edit.js"></script>
</body>
</html>

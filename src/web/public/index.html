<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SECOND TAKE · Reels Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark">2T</span>
      <div>
        <strong id="brandName">SECOND TAKE</strong>
        <span class="sub" id="brandConcept">K-pop Live Versions &amp; Covers</span>
      </div>
    </div>
    <nav class="views">
      <button class="view-tab on" data-view="operate">운영</button>
      <button class="view-tab" data-view="manage">데이터 등록</button>
    </nav>
    <form class="run" id="runForm">
      <label>운영 날짜 <input type="date" id="runDate" required></label>
      <label class="check"><input type="checkbox" id="reselect"> 재선곡</label>
      <button type="submit" id="runBtn">파이프라인 실행</button>
    </form>
  </header>

  <div class="scenarios" id="scenarios"></div>
  <div class="notice" id="notice" hidden></div>
  <div class="server-note" id="serverNote" hidden></div>

  <div class="layout" id="viewOperate">
    <aside class="days">
      <h2>운영 기록</h2>
      <ol id="dayList"><li class="muted">아직 실행 기록이 없습니다.</li></ol>
      <a class="guide-link" href="/guide" target="_blank">공식 원본 안내 목록 ↗</a>
    </aside>

    <main id="detail" class="detail">
      <section class="empty">
        <h1>후보에서 발행 예약까지, 한 화면에서</h1>
        <p>위의 시나리오 날짜를 누르거나 날짜를 골라 <b>파이프라인 실행</b>을 누르세요. 선곡 → 권한 판정 → 영어 문구 → 9:16 영상 → 드라이런 예약이 순서대로 실행됩니다.</p>
      </section>
    </main>
  </div>

  <div class="layout" id="viewManage" hidden>
    <aside class="days">
      <h2>등록 단계</h2>
      <ol id="stepList" class="steps"></ol>
      <p class="small muted" style="padding:0 14px">위에서 아래 순서로 채웁니다. 앞 단계가 없으면 뒤 단계를 저장할 수 없습니다.</p>
    </aside>
    <main id="managePanel" class="detail"></main>
  </div>

  <template id="tplDay">
    <section class="flow" data-ref="flow"></section>
    <div class="cols">
      <div class="col-main">
        <section class="card" data-ref="selCard"></section>
        <section class="card">
          <details>
            <summary><b>후보를 어떻게 비교했는지 보기</b> <span class="muted small" data-ref="ruleVer"></span></summary>
            <div class="table-wrap"><table class="cands" data-ref="candTable"></table></div>
          </details>
        </section>
        <section class="card" data-ref="rightsCard"></section>
        <section class="card" data-ref="segCard"></section>
        <section class="card" data-ref="jobCard"></section>
      </div>
      <div class="col-side">
        <section class="card phone-card" data-ref="previewCard"></section>
        <section class="card" data-ref="captionCard"></section>
      </div>
    </div>
  </template>

  <script src="/terms.js"></script>
  <script src="/app.js"></script>
  <script src="/manage.js"></script>
</body>
</html>
